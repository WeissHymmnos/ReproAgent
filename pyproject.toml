[project]
name = "reproagent"
version = "1.0.0"
description = "研报因子自动复现系统 — PDF 卖方研报 → 因子提取 → 回测复现 → 偏差自愈 → 因子库"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlmodel>=0.0.16",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "jinja2>=3.1",
    "polars>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "textual>=0.50",
    "anyio>=4.0",
    "pypdf>=4.0",
    "openai>=1.40",
    "anthropic>=0.30",
    "pymupdf>=1.24.11",
    "tqdm>=4.65.0",
    "pillow>=10.0.0",
    "httpx[socks]>=0.25.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0",
]
rqalpha = ["rqalpha>=6.1"]
pdf-vision = ["pdf2image>=1.17"]
instructor = ["instructor>=1.0"]
ricequant = ["rqdatac"]
qlib = []
tushare = ["tushare"]
paddle = ["paddleocr"]
vlm = ["transformers>=4.45", "torch", "torchvision", "accelerate"]
formula = ["pix2text"]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
reproagent = "reproagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reproagent", "src/finreportparser"]

# Map src layout so both packages install from workspace sources under editable mode.
[tool.hatch.build.targets.wheel.sources]
"src/reproagent" = "reproagent"
"src/finreportparser" = "finreportparser"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# HTML template strings
"src/reproagent/library/dashboard.py" = ["E501"]
"src/reproagent/web/workstation.py" = ["E501"]
# GFM table fixtures keep real-world wide rows
"tests/unit/test_table_repair.py" = ["E501"]
# Vendored PDF backend: style noise from upstream
"src/finreportparser/**" = ["E501", "E701", "E702", "E731", "E722"]
# Preserved prototype from 量化agent.zip — do not reformat as core code
"src/reproagent/legacy_quant/**" = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
packages = ["reproagent"]
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["import-untyped", "import-not-found"]
exclude = ["src/reproagent/legacy_quant"]

[[tool.mypy.overrides]]
module = "reproagent.legacy_quant.*"
ignore_errors = true
